name: Install & build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Build Docker image
        run: docker compose -f docker-compose.local.yml build
      - name: Start images
        run: docker compose -f docker-compose.local.yml up -d
      - name: Wait for application
        run: timeout 300 bash -c 'until curl -s -o /dev/null http://localhost:8088; do sleep 5; done'
      - name: Run tests
        run: docker compose -f docker-compose.local.yml exec -T omslagroute python manage.py test --noinput --top-level-directory .

      - if: ${{ failure() }}
        name: "ON FAILURE: Which containers were running while failing?"
        run: docker ps -a

      - if: ${{ failure() }}
        name: "ON FAILURE: logs"
        run: docker logs salmagundi_wonen_omslagroute

      - if: ${{ failure() }}
        name: "ON FAILURE: Database logs"
        run: docker logs omslagroute-database-1
